server:
  port: 8084

spring:
  application:
    name: leave-service

  datasource:
    url: jdbc:postgresql://localhost:5432/hrm_leave
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/hrm-realm

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka