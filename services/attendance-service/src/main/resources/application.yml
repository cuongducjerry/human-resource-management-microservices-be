server:
  port: 8083

spring:
  application:
    name: attendance-service

  datasource:
    url: jdbc:postgresql://postgres-attendance:5432/hrm_attendance  # container Postgres
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/hrm-realm

  kafka:
    bootstrap-servers: kafka:9092  # container Kafka
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://registry:8761/eureka  # container Eureka