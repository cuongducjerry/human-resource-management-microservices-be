server:
  port: 8083

spring:
  application:
    name: attendance-service

  datasource:
    url: jdbc:postgresql://localhost:5432/hrm_attendance
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka