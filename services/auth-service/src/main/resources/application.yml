server:
  port: 8087

spring:
  application:
    name: auth-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/hrm-realm

  datasource:
    url: jdbc:postgresql://postgres-auth:5432/hrm_employee  # DB container
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: kafka:9092  # Kafka container
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://registry:8761/eureka  # Eureka container
    register-with-eureka: true
    fetch-registry: true

keycloak:
  auth-server-url: http://keycloak:8080  # Keycloak container
  realm: hrm-realm

  # CLIENT LOGIN
  login-client-id: hrm-client
  login-client-secret: 60vVNPLhEO6hrytOgJTgBBX8ZZg3oCCG

  # CLIENT ADMIN
  admin-client-id: auth-service-client
  admin-client-secret: sHDjurV4x8BtKNYeOhOwKRd46iJwoytw

  token-url: http://keycloak:8080/realms/hrm-realm/protocol/openid-connect/token
  logout-url: http://keycloak:8080/realms/hrm-realm/protocol/openid-connect/logout
  admin-create-user-url: http://keycloak:8080/admin/realms/hrm-realm/users
  admin-base-url: http://keycloak:8080/admin/realms/hrm-realm