server:
  port: 8080

spring:
  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/hrm-realm

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: organization-service
              uri: lb://organization-service
              predicates:
                - Path=/api/organization/**

            - id: employee-service
              uri: lb://employee-service
              predicates:
                - Path=/api/employees/**, /api/contracts/**

            - id: attendance-service
              uri: lb://attendance-service
              predicates:
                - Path=/api/attendance/**

            - id: leave-service
              uri: lb://leave-service
              predicates:
                - Path=/api/leave/**

            - id: payroll-service
              uri: lb://payroll-service
              predicates:
                - Path=/api/payroll/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notification/**

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true