server:
  port: 8080

spring:
  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/hrm-realm

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: organization-service
              uri: lb://organization-service
              predicates:
                - Path=/api/organizations/**, /api/positions/**

            - id: employee-service
              uri: lb://employee-service
              predicates:
                - Path=/api/employees/**, /api/contracts/**

            - id: attendance-service
              uri: lb://attendance-service
              predicates:
                - Path=/api/attendances/**, /api/work-shifts/**

            - id: leave-service
              uri: lb://leave-service
              predicates:
                - Path=/api/leaves/**

            - id: payroll-service
              uri: lb://payroll-service
              predicates:
                - Path=/api/payrolls/**, /api/attendance-summary/**, /api/leave-summary/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**

            - id: notification-ws
              uri: lb:ws://notification-service
              predicates:
                - Path=/ws-hrm-notification/**
              filters:
                - PreserveHostHeader

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

            - id: dashboard-service
              uri: lb://dashboard-service
              predicates:
                - Path=/api/dashboard/**

eureka:
  client:
    service-url:
      defaultZone: http://registry:8761/eureka
    register-with-eureka: true
    fetch-registry: true