server:
  port: 8086

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/hrm_notification
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/hrm-realm

  data:
    redis:
      host: localhost
      port: 6379
      database: 2

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      enable-auto-commit: true
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    listener:
      missing-topics-fatal: false


  mail:
    host: smtp.gmail.com
    port: 587
    username: cuongducjerry@gmail.com
    password: nhuwdjpwcxyiwcxn
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

logging:
  level:
    org.springframework.mail: DEBUG
    jakarta.mail: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka